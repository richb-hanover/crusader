[package]
name = "crusader-android"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
eframe = { version = "0.31", features = ["wgpu"] }
crusader-gui-lib = { path = "../src/crusader-gui-lib" }
crusader-lib = { path = "../src/crusader-lib" }
winit = { version = "0.30", features = ["android-game-activity"] }
jni = "0.19.0"
ndk-context = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.11.0"
android-activity = { version = "0.6", features = ["game-activity"] }

[lib]
name = "main"
crate-type = ["cdylib"]
